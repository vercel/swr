# .github/workflows/perfagent.yml
# Auto-generated by PerfAgent — edit freely after merging.

name: PerfAgent

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  perfagent:
    runs-on: ubuntu-latest
    name: Performance Analysis

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run PerfAgent
        id: perfagent
        uses: SelvarajMurugan/perfagent-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          budget-lcp-ms: '2500'
          budget-cls: '0.10'
          budget-inp-ms: '200'
          fail-on-issues: 'high'
          auto-fix: 'false'
          url: 'https://swr.vercel.app'

      - name: Show results
        if: always()
        run: |
          echo "Issues:   ${{ steps.perfagent.outputs.issues-found }}"
          echo "Critical: ${{ steps.perfagent.outputs.critical-issues }}"
          echo "Budget:   ${{ steps.perfagent.outputs.budget-passed }}"
